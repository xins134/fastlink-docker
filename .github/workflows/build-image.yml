name: Build Fastlink image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "*.deb"
      - "docker/**"
      - "tests/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check startup scripts
        run: |
          bash -n docker/entrypoint.sh docker/sync-package.sh docker/keyring.sh docker/auto-close-window.sh
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check desktop tray
        timeout-minutes: 2
        run: |
          docker run --rm --entrypoint /usr/bin/gosu \
            --env HOME=/home/app --env USER=app \
            --env SCREEN_WIDTH=1280 --env SCREEN_HEIGHT=800 --env SCREEN_DEPTH=24 \
            --volume "$PWD/tests/check-tray-runtime.py:/tmp/check-tray-runtime.py:ro" \
            "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            app dbus-run-session -- python3 /tmp/check-tray-runtime.py

      - name: Publish amd64 image
        env:
          FASTLINK_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$FASTLINK_IMAGE_TAGS"
