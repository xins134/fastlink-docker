[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -nolisten tcp -ac +extension RANDR
user=app
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox -no-slit
stopsignal=TERM
user=app
environment=HOME=/home/app,USER=app,DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/fastlink-dbus.sock"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tint2]
command=/usr/bin/tint2 -c /etc/xdg/tint2/tint2rc
stopsignal=TERM
user=app
environment=HOME=/home/app,USER=app
priority=25
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -localhost %(ENV_VNC_AUTH_ARGS)s -rfbport 5900 -repeat -nomodtweak -wait 100 -defer 100 -nonap
user=app
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
user=app
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fastlink]
command=/opt/com.flapp.clients.apex/apex-client
directory=/opt/com.flapp.clients.apex
user=app
environment=HOME=/home/app,USER=app,DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/fastlink-dbus.sock"
priority=50
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
